<!doctype html>
<html lang="en" data-workspace-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const storageKey = "veltact:workspace-theme:v1";
        let theme = "light";
        try {
          const storedTheme = window.localStorage.getItem(storageKey);
          if (storedTheme === "light" || storedTheme === "dark") {
            theme = storedTheme;
          }
        } catch {}
        document.documentElement.dataset.workspaceTheme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>Veltact | Buyer workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./workspace-v5.css?v=workspace-v5-1" />
    <link rel="stylesheet" href="./styles.css?v=workspace-v5-1" />
    <script type="importmap">
      {
        "imports": {
          "@veltact/contracts": "./assets/vendor/contracts/index.js",
          "zod": "./assets/vendor/zod/index.js"
        }
      }
    </script>
  </head>
  <body data-theme="buyer">
    <a class="skip-link" href="#app">Skip to buyer workspace</a>
    <main id="app" class="app-shell" aria-live="polite"></main>
    <script type="module" src="./assets/main.js?v=workspace-v5-1"></script>
    <script type="module" src="./assets/workspaceTheme.js?v=workspace-v5-1"></script>
  </body>
</html>
