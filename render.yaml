services:
  - type: web
    name: veltact
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    domains:
      - veltact.com
    envVars:
      - key: NODE_ENV
        value: development
      - key: NODE_VERSION
        value: "22"
      - key: WEB_ORIGIN
        value: https://veltact.com
      - key: PUBLIC_BASE_URL
        value: https://veltact.com
      - key: API_PUBLIC_URL
        value: https://veltact.com
      - key: BUYER_CAPABILITY_AUTH_REQUIRED
        value: "false"
      - key: PAYMENT_PROVIDER
        value: pinch
      - key: PINCH_CLIENT_ID
        sync: false
      - key: PINCH_SECRET_KEY
        sync: false
      - key: PINCH_AUTH_URL
        value: https://auth.getpinch.com.au/connect/token
      - key: PINCH_API_BASE_URL
        value: https://api.getpinch.com.au/test/
      - key: PINCH_API_VERSION
        value: "2020.1"
      - key: PINCH_RETURN_URL
        value: https://veltact.com/api/pinch/return
      - key: PINCH_WEBHOOK_SECRET
        sync: false
      - key: VELTACT_RESEARCH_PROVIDER
        value: fixture
      - key: EMAIL_PROVIDER
        value: local_demo
      - key: SMS_PROVIDER
        value: local_demo
